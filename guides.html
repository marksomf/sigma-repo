<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guides - MarkSigma's Repo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f2f7;
            color: #333;
        }
        .banner {
            width: 100%;
            background: #f8fafc;
            color: #007aff;
            text-align: center;
            padding: 16px 0 12px 0;
            font-family: 'Montserrat', 'SF Pro Display', 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            font-weight: 700;
            font-size: 1.4em;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 1px 0 #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1500;
            border-bottom: 1px solid #e3e8ee;
        }
        .menu-container {
            position: fixed;
            top: 48px;
            left: 0;
            height: 100%;
            width: 250px;
            background-color: #fff;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            transform: translateX(-250px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .menu-container.active {
            transform: translateX(0);
        }
        .hamburger {
            position: fixed;
            top: 60px;
            left: 20px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .hamburger span {
            width: 100%;
            height: 3px;
            background-color: #007aff;
            transition: all 0.3s ease;
        }
        .menu-items {
            padding: 60px 0 0 0;
            list-style: none;
        }
        .menu-items li {
            padding: 15px 20px;
            border-bottom: 1px solid #f2f2f2;
        }
        .menu-items li a {
            color: #333;
            text-decoration: none;
            font-size: 16px;
            display: block;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }
        .overlay.active {
            display: block;
        }
        .guides-container {
            max-width: 600px;
            margin: 110px auto 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 50px 30px;
            text-align: center;
        }
        .guides-container h1 {
            font-family: 'Montserrat', 'SF Pro Display', 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            color: #007aff;
            margin-bottom: 18px;
        }
        .guides-container p {
            font-size: 1.2em;
            color: #666;
        }
        body { padding-top: 60px; }
    </style>
</head>
<body>
    <div class="banner">jailbreaking is great!</div>
    <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <div class="menu-container" id="menu">
        <ul class="menu-items">
            <li><a href="index.html">Home</a></li>
            <li><a href="add-repo.html">Add Repo</a></li>
            <li><a href="tweaks-list.html">Tweaks</a></li>
            <li><a href="guides.html">Guides</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="credits.html">Credits</a></li>
        </ul>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="guides-container">
        <h1>Guides</h1>
        <p>Nothing to see here yet!</p>
    </div>
    <script>
        function toggleMenu() {
            document.getElementById('menu').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
    </script>
</body>
</html>
