<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MarkSigma's Repo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f2f7;
            color: #333;
        }
        .banner {
            width: 100%;
            background: #f8fafc;
            color: #007aff;
            text-align: center;
            padding: 16px 0 12px 0;
            font-family: 'Montserrat', 'SF Pro Display', 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            font-weight: 700;
            font-size: 1.4em;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 1px 0 #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1500;
            border-bottom: 1px solid #e3e8ee;
        }
        .menu-container {
            position: fixed;
            top: 48px;
            left: 0;
            height: 100%;
            width: 250px;
            background-color: #fff;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            transform: translateX(-250px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .menu-container.active {
            transform: translateX(0);
        }
        .hamburger {
            position: fixed;
            top: 60px;
            left: 20px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .hamburger span {
            width: 100%;
            height: 3px;
            background-color: #007aff;
            transition: all 0.3s ease;
        }
        .menu-items {
            padding: 60px 0 0 0;
            list-style: none;
        }
        .menu-items li {
            padding: 15px 20px;
            border-bottom: 1px solid #f2f2f2;
        }
        .menu-items li a {
            color: #333;
            text-decoration: none;
            font-size: 16px;
            display: block;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }
        .overlay.active {
            display: block;
        }
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 90px 20px 20px;
        }
        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007aff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .welcome-text {
            text-align: center;
            margin-top: 20px;
            line-height: 1.6;
        }
        .tweak-count {
            margin: 20px auto 0 auto;
            text-align: center;
            font-size: 1.1em;
            background: #fff;
            padding: 10px 0;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            font-family: 'Montserrat', 'SF Pro Display', 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .repo-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px auto;
            max-width: 600px;
        }
        .repo-button {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px;
            padding: 12px 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 180px;
            font-family: 'Montserrat', 'SF Pro Display', 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            font-weight: 500;
        }
        .repo-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .repo-button img {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }
        .view-tweaks-btn {
            display: block;
            width: 220px;
            margin: 30px auto;
            padding: 15px 20px;
            background-color: #007aff;
            color: white;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
            font-family: 'Montserrat', 'SF Pro Display', 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            font-size: 1.1em;
            letter-spacing: 1px;
        }
        .view-tweaks-btn:hover {
            background-color: #005bb5;
        }
        body { padding-top: 60px; }
        @media (max-width: 600px) {
            .profile-container { padding-top: 80px; }
            .tweak-count { font-size: 1em; }
            .repo-button { width: 95%; }
            .view-tweaks-btn { width: 95%; }
        }
    </style>
</head>
<body>
    <div class="banner">jailbreaking is great!</div>
    <!-- Hamburger Menu -->
    <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <div class="menu-container" id="menu">
        <ul class="menu-items">
            <li><a href="index.html">Home</a></li>
            <li><a href="add-repo.html">Add Repo</a></li>
            <li><a href="tweaks-list.html">Tweaks</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="credits.html">Credits</a></li>
            <li><a href="guides.html">Guides</a></li>

        </ul>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="profile-container">
        <img src="profile.jpg" alt="Profile Picture" class="profile-picture">
        <div class="welcome-text">
            <h1>MarkSigma's Repo</h1>
            <p>Thanks for stopping by! You can add my repo to your favorite package manager below 👇</p>
        </div>
    </div>
    <div class="tweak-count">
        <strong>Total Tweaks in Repo:</strong> 41
    </div>
    <div class="repo-buttons">
        <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://repo.marksigma.co.uk/" class="repo-button">
            <img src="icons/cydia.png" alt="Cydia">
            <span>Add to Cydia</span>
        </a>
        <a href="sileo://source/https://repo.marksigma.co.uk/" class="repo-button">
            <img src="icons/sileo.png" alt="Sileo">
            <span>Add to Sileo</span>
        </a>
        <a href="zbra://sources/add/https://repo.marksigma.co.uk/" class="repo-button">
            <img src="icons/zebra.png" alt="Zebra">
            <span>Add to Zebra</span>
        </a>
    </div>
    <a href="tweaks-list.html" class="view-tweaks-btn">View All Tweaks</a>
    <script>
        function toggleMenu() {
            document.getElementById('menu').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
    </script>
</body>
</html>
